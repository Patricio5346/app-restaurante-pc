name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Create capacitor.config.json
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.freysa.compras",
            "appName": "DCOMPRAS",
            "webDir": "www",
            "server": {
              "url": "https://script.google.com/macros/s/AKfycby0SYoEusF5NNUllEn3KY7Y8bm7Cc60xTkCZzme1nUEvzVyRaZBR00qPAbpGXUjQ8jE/exec",
              "cleartext": true
            }
          }
          EOF

      - name: Add and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
